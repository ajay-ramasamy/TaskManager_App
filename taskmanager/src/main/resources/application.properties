# ===== PRODUCTION DATABASE CONFIGURATION =====
# Use environment variables for production (Railway will provide these)
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/taskmanager_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Ajay@2005}

# ===== JPA CONFIGURATION =====
spring.jpa.hibernate.ddl-auto=update
# Disable in production for better performance
spring.jpa.show-sql=false
# Disable in production
spring.jpa.properties.hibernate.format-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ===== SERVER CONFIGURATION =====
server.port=${PORT:8080}
server.servlet.context-path=/

# ===== CORS CONFIGURATION =====
# Allowed origins for production (set via environment variables)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://your-todo-app.netlify.app}

# ===== LOGGING CONFIGURATION =====
# Reduce logging level in production for better performance
logging.level.com.taskmanager=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
logging.level.org.springframework.web=WARN
logging.file.name=application.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ===== PRODUCTION-SPECIFIC SETTINGS =====
# Disable devtools in production
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# JWT Configuration (use environment variables in production)
jwt.secret=${JWT_SECRET:your-default-secret-key-change-in-production}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Connection pool settings for production
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# MySQL specific optimizations
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Security headers (if using Spring Security)
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=none
